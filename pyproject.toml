[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-repl-sandbox"
version = "0.1.0"
description = "Sandboxed Python REPL for agent code evaluation with AST safety analysis, memory limits, and timeouts"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Ejaj Mahmud", email = "dev@ejajmahmud.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
agent-repl-sandbox = "agent_repl_sandbox.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["agent_repl_sandbox*"]
